<!DOCTYPE html>
<html>

<head>

<title>

MediAssist Login

</title>

<link
rel="stylesheet"
href="../static/css/login.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

</head>


<body>


<div class="login-box">

<h1>

💊 MediAssist

</h1>


<input
type="text"
id="name"
placeholder="Enter name"
>


<input
type="number"
id="age"
placeholder="Age"
>


<select id="gender">

<option>

Select Gender

</option>

<option>

Female

</option>

<option>

Male

</option>

<option>

Other

</option>

</select>



<button
id="loginBtn"
>

Login →

</button>


</div>


<script
src="../static/js/login.js"
>

</script>

</body>

</html>
